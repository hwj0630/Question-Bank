<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>入党教育培训班真题题库 · 答题卡悬浮</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;padding:24px 16px 70px;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#f5f6f8;color:#222;line-height:1.7;
  }
  .wrap{max-width:880px;margin:0 auto;}
  header{
    background:linear-gradient(135deg,#c62828,#8e0000);
    color:#fff;padding:22px 26px;border-radius:14px;
    box-shadow:0 6px 18px rgba(198,40,40,.25);
  }
  h1{margin:0 0 4px;font-size:21px;letter-spacing:1px;}
  .sub{opacity:.85;font-size:13px;}
  .stats{display:flex;gap:26px;margin-top:16px;flex-wrap:wrap;font-size:13px;}
  .stats div{display:flex;flex-direction:column;}
  .stats b{font-size:19px;line-height:1.3;font-weight:700;}

  .panel{
    background:#fff;border-radius:12px;padding:14px 16px;margin:16px 0;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .panel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .panel .row + .row{margin-top:10px;}
  .panel .lbl{font-size:13px;color:#888;min-width:56px;}
  .panel button{
    padding:6px 16px;border:1.5px solid #e0e0e0;background:#fff;border-radius:20px;
    font-size:13.5px;cursor:pointer;font-family:inherit;color:#444;transition:.15s;
  }
  .panel button:hover{border-color:#ef9a9a;}
  .panel button.active{background:#c62828;border-color:#c62828;color:#fff;}
  .panel .reset{margin-left:auto;border-color:#c62828;color:#c62828;}
  .panel .reset:hover{background:#ffebee;}

  /* ===== 题目卡片 ===== */
  .card{
    background:#fff;border-radius:12px;padding:16px 18px;margin-bottom:12px;
    box-shadow:0 1px 3px rgba(0,0,0,.07);
    scroll-margin-top: 20px;
  }
  .card.flash{animation:flash 1.6s ease;}
  @keyframes flash{
    0%{box-shadow:0 0 0 3px rgba(198,40,40,.55);}
    100%{box-shadow:0 1px 3px rgba(0,0,0,.07);}
  }
  .qhead{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .tag{font-size:12px;padding:1px 9px;border-radius:20px;}
  .tag.choice{background:#e8eaf6;color:#3949ab;}
  .tag.fill{background:#fff3e0;color:#e65100;}
  .tag.judge{background:#e0f2f1;color:#00695c;}
  .num{font-size:13px;color:#999;margin-left:auto;font-weight:600;}
  .qtext{font-weight:500;margin-bottom:10px;font-size:15.5px;}
  .options{display:flex;flex-direction:column;gap:8px;}
  .options.judge{flex-direction:row;}
  .options.judge .opt{flex:1;text-align:center;}
  .opt{
    text-align:left;padding:9px 14px;border:1.5px solid #e4e4e4;border-radius:9px;
    background:#fff;font-size:15px;cursor:pointer;font-family:inherit;
    transition:.15s;color:#333;line-height:1.55;
  }
  .opt:hover:not(:disabled){border-color:#c62828;background:#fff8f8;}
  .opt:disabled{cursor:default;opacity:.95;}
  .opt.ok{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;}
  .opt.bad{border-color:#c62828;background:#ffebee;color:#b71c1c;}
  .fillq{font-size:15.5px;line-height:2.1;font-weight:500;}
  .blank{
    border:none;border-bottom:1.6px solid #bbb;background:#fafafa;
    min-width:130px;padding:2px 8px;font-size:15px;text-align:center;
    outline:none;color:#1565c0;font-family:inherit;border-radius:4px 4px 0 0;
  }
  .blank:focus{border-bottom-color:#c62828;background:#fff8f8;}
  .blank.ok{border-bottom-color:#2e7d32;background:#e8f5e9;color:#1b5e20;}
  .blank.bad{border-bottom-color:#c62828;background:#ffebee;color:#b71c1c;}
  .blank:disabled{opacity:1;}
  .submit{
    margin-top:12px;padding:8px 22px;background:#c62828;color:#fff;border:none;
    border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;
  }
  .submit:hover{background:#a11c1c;}
  .fb{margin-top:11px;font-size:14px;padding:8px 12px;border-radius:8px;}
  .fb.right{background:#e8f5e9;color:#1b5e20;}
  .fb.wrong{background:#ffebee;color:#b71c1c;}
  .empty{text-align:center;color:#999;padding:40px;}
  .note{
    margin-top:18px;padding:12px 16px;background:#fff8e1;border-radius:10px;
    font-size:13px;color:#795548;line-height:1.8;
  }

  /* ===== 答题卡悬浮按钮 ===== */
  .fab-toc {
    position: fixed;
    right: 24px;
    bottom: 40px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #1976d2;
    color: #fff;
    border: none;
    box-shadow: 0 4px 14px rgba(25, 118, 210, 0.45);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 900;
    transition: transform 0.2s, background 0.2s;
  }
  .fab-toc:hover {
    background: #1565c0;
    transform: scale(1.05);
  }
  .fab-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    background: #c62828;
    color: #fff;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 10px;
    border: 2px solid #f5f6f8;
    font-weight: normal;
    line-height: 1.2;
  }

  /* ===== 答题卡弹窗 ===== */
  .toc-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 1000;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s, visibility 0.3s;
  }
  .toc-modal.show {
    opacity: 1;
    visibility: visible;
  }
  .toc-content {
    background: #fff;
    width: 100%;
    max-height: 75vh;
    border-radius: 16px 16px 0 0;
    padding: 20px;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex;
    flex-direction: column;
  }
  .toc-modal.show .toc-content {
    transform: translateY(0);
  }
  /* PC端居中显示 */
  @media (min-width: 600px) {
    .toc-modal {
      align-items: center;
      justify-content: center;
    }
    .toc-content {
      width: 90%;
      max-width: 600px;
      border-radius: 16px;
      max-height: 80vh;
    }
  }
  .toc-head {
    display: flex;
    align-items: center;
    margin-bottom: 16px;
  }
  .toc-head .title {
    font-weight: 600;
    font-size: 16px;
    color: #333;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toc-head .title::before {
    content: "";
    width: 6px;
    height: 16px;
    border-radius: 3px;
    background: #1976d2;
  }
  .toc-summary {
    font-size: 13px;
    color: #888;
    margin-left: 16px;
    flex: 1;
  }
  .toc-close {
    background: none;
    border: none;
    font-size: 26px;
    color: #aaa;
    cursor: pointer;
    line-height: 1;
    padding: 0 4px;
    transition: color 0.2s;
  }
  .toc-close:hover { color: #333; }
  
  .legend {
    display: flex;
    gap: 16px;
    font-size: 13px;
    color: #666;
    margin-bottom: 12px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
  i.todo { background: #f1f1f1; border: 1px solid #ddd; }
  i.right { background: #c8e6c9; border: 1px solid #81c784; }
  i.wrong { background: #ffcdd2; border: 1px solid #e57373; }

  .toc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
    gap: 8px;
    overflow-y: auto;
    padding-right: 4px;
    flex: 1;
  }
  .toc-btn {
    padding: 8px 0;
    border-radius: 8px;
    border: 1px solid #e0e0e0;
    background: #fafafa;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    color: #666;
    transition: 0.12s;
  }
  .toc-btn:hover { border-color: #1976d2; color: #1976d2; }
  .toc-btn.right { background: #e8f5e9; border-color: #a5d6a7; color: #1b5e20; font-weight: 600; }
  .toc-btn.wrong { background: #ffebee; border-color: #ef9a9a; color: #b71c1c; font-weight: 600; }

  @media(max-width:520px){
    .stats{gap:16px;}
    .panel .reset{margin-left:0;}
    .fab-toc { right: 16px; bottom: 20px; width: 54px; height: 54px; font-size: 13px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>第五十期入党教育培训班 · 真题题库</h1>
    <div class="sub">统一编号 · 逐题即时判分 · 答题卡悬浮</div>
    <div class="stats">
      <div><span>当前题目</span><b id="stat-total">0</b></div>
      <div><span>已作答</span><b id="stat-done">0</b></div>
      <div><span>答对</span><b id="stat-right">0</b></div>
      <div><span>正确率</span><b id="stat-rate">—</b></div>
    </div>
  </header>

  <div class="panel">
    <div class="row">
      <span class="lbl">练习模式</span>
      <button data-mode="all" class="active">综合练习</button>
      <button data-mode="choice">选择题练习</button>
      <button data-mode="fill">填空题练习</button>
      <button data-mode="judge">判断题练习</button>
    </div>
    <div class="row">
      <span class="lbl">题库来源</span>
      <button data-source="all" class="active">全部</button>
      <button data-source="p1">练习（一）</button>
      <button data-source="p2">练习（二）</button>
      <button class="reset" id="resetBtn">重新开始</button>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="note">
    <b>说明：</b>题号已全库统一连续编号；点击右下角“答题卡”可查看整体进度，点击题号即可跳转定位。
  </div>
</div>

<!-- 悬浮答题卡按钮 -->
<button class="fab-toc" id="fabToc">
  答题卡
  <span class="fab-badge" id="fabBadge">0/0</span>
</button>

<!-- 答题卡弹窗 -->
<div class="toc-modal" id="tocModal">
  <div class="toc-content">
    <div class="toc-head">
      <span class="title">答题卡</span>
      <span class="toc-summary" id="tocSummary">已做 0/0 · 正确 0 · 错误 0</span>
      <button class="toc-close" id="tocClose">×</button>
    </div>
    <div class="legend">
      <span><i class="todo"></i>未做</span>
      <span><i class="right"></i>正确</span>
      <span><i class="wrong"></i>错误</span>
    </div>
    <div class="toc-grid" id="tocGrid"></div>
  </div>
</div>

<script>
/* =====================================================================
   题库数据（与上一版一致，已去重）
   ===================================================================== */
const BANK = {
  p1: {
    label: '第五十期入党教育培训班真题练习（一）',
    choice: [
      {q:'中国共产党的最高理想和最终目标是（　）。', o:['全面建成小康社会','实现中华民族伟大复兴','实现共产主义','基本实现社会主义现代化'], a:2},
      {q:'下列不属于党的行动指南的是（　）。', o:['马克思列宁主义','毛泽东思想','习近平新时代中国特色社会主义思想','社会主义市场经济理论'], a:3},
      {q:'习近平新时代中国特色社会主义思想被确立为党的指导思想，是在（　）。', o:['党的十八大','党的十九大','党的二十大','党的二十届四中全会'], a:1},
      {q:'中国共产党的根本宗旨是（　）。', o:['为人民服务','全心全意为人民服务','实现共同富裕','为人民谋幸福'], a:1},
      {q:'党执政兴国的第一要务是（　）。', o:['改革','稳定','发展','创新'], a:2},
      {q:'我国现阶段社会的主要矛盾是（　）。', o:['人民日益增长的物质文化需要同落后的社会生产之间的矛盾','人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾','先进的社会制度同落后的生产力之间的矛盾','公有制经济与非公有制经济之间的矛盾'], a:1},
      {q:'中国共产党在社会主义初级阶段的基本路线的中心是（　）。', o:['政治建设','文化建设','经济建设','社会建设'], a:2},
      {q:'四项基本原则的核心是（　）。', o:['坚持社会主义道路','坚持人民民主专政','坚持中国共产党的领导','坚持马克思列宁主义毛泽东思想'], a:2},
      {q:'党的思想路线的核心是（　）。', o:['一切从实际出发','理论联系实际','实事求是','在实践中检验真理和发展真理'], a:2},
      {q:'党的群众路线的正确表述是（　）。', o:['一切为了群众，一切依靠群众，从群众中来，到群众中去','从群众中来，到群众中去，集中起来，坚持下去','密切联系群众，虚心向群众学习','依靠群众，发动群众，服务群众'], a:0},
      {q:'“三个代表”重要思想创造性地回答了（　）的问题。', o:['什么是社会主义、怎样建设社会主义','建设什么样的党、怎样建设党','实现什么样的发展、怎样发展','新时代坚持和发展什么样的中国特色社会主义'], a:1},
      {q:'科学发展观的核心立场是（　）。', o:['全面协调可持续','统筹兼顾','以人为本','推动发展'], a:2},
      {q:'中国特色社会主义最本质的特征是（　）。', o:['共同富裕','中国共产党的领导','人民当家作主','依法治国'], a:1},
      {q:'中国特色社会主义制度的最大优势是（　）。', o:['人民当家作主','中国共产党的领导','集中力量办大事','按劳分配为主体'], a:1},
      {q:'中国共产党人的初心和使命是（　）。', o:['实现共产主义远大理想','为中国人民谋幸福、为中华民族谋复兴','全面建成社会主义现代化强国','建设富强民主文明和谐美丽的现代化国家'], a:1},
      {q:'伟大建党精神的完整表述是（　）。', o:['坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民','坚定信念、艰苦奋斗，实事求是、敢闯新路','爱国、进步、民主、科学','自力更生、艰苦奋斗，全心全意为人民服务'], a:0},
      {q:'我国现阶段实行的分配制度是（　）。', o:['按劳分配为主体、多种分配方式并存','按需分配','按资分配为主体','平均分配'], a:0},
      {q:'我国的根本政治制度是（　）。', o:['人民代表大会制度','中国共产党领导的多党合作和政治协商制度','民族区域自治制度','基层群众自治制度'], a:0},
      {q:'中华人民共和国的一切权力属于（　）。', o:['中国共产党','全国人民代表大会','人民','国务院'], a:2},
      {q:'申请入党的最低年龄是（　）。', o:['16岁','18岁','20岁','22岁'], a:1},
      {q:'下列人员中，可以申请加入中国共产党的是（　）。', o:['未满18周岁的中学生','承认党的纲领和章程、愿意参加党的一个组织并积极工作、执行党的决议和按期交纳党费的年满18岁知识分子','持有外国国籍的华裔企业家','不愿参加党的组织生活的退休人员'], a:1},
      {q:'党章规定的党员义务一共有（　）。', o:['6项','7项','8项','9项'], a:2},
      {q:'党章规定的党员权利一共有（　）。', o:['6项','7项','8项','9项'], a:2},
      {q:'下列不属于党员义务的是（　）。', o:['认真学习马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观、习近平新时代中国特色社会主义思想','坚持党和人民的利益高于一切，个人利益服从党和人民的利益，吃苦在前，享受在后，克己奉公，多做贡献','参加党的有关会议，阅读党的有关文件，接受党的教育和培训','自觉遵守党的纪律，首先是党的政治纪律和政治规矩'], a:2},
      {q:'下列不属于党员权利的是（　）。', o:['参加党的有关会议，阅读党的有关文件，接受党的教育和培训','对党的工作提出建议和倡议','行使表决权、选举权，有被选举权','向党组织交纳党费'], a:3},
      {q:'党员对党的决议和政策有不同意见时，正确的做法是（　）。', o:['拒绝执行，并公开发表反对意见','在坚决执行的前提下，可以声明保留，并且可以把自己的意见向党的上级组织直至中央提出','先在党内少数人中串联，形成反对意见','直接向上级党委提出辞职'], a:1},
      {q:'党员如果发现党组织或党的领导干部有违纪违法行为，应当（　）。', o:['装作不知道，明哲保身','只向身边同事私下议论','按照规定程序向党组织反映，或通过信访、举报渠道如实检举','在网络上公开发帖曝光'], a:2},
      {q:'党员必须自觉遵守党的纪律，首先是（　）。', o:['组织纪律','政治纪律和政治规矩','廉洁纪律','群众纪律'], a:1},
      {q:'党员应当发扬社会主义新风尚，带头实践（　）。', o:['社会主义核心价值观和社会主义荣辱观','个人主义价值观','享乐主义生活方式','自由主义思想'], a:0},
      {q:'党员有义务切实开展（　），勇于揭露和纠正违反党的原则的言行。', o:['调查研究','批评和自我批评','民主协商','党内选举'], a:1},
      {q:'党员有义务为了保护国家和人民的利益，在一切困难和危险的时刻（　）。', o:['挺身而出，英勇斗争，不怕牺牲','先行撤离，保全自己','等待组织安排','视情况而定'], a:0},
      {q:'党员在党内监督方面的权利是（　）。', o:['有权对任何党组织和党员提出批评、揭发、检举和控告，并要求有关组织给以负责的答复','有权随意查阅党内所有涉密文件','有权否决党组织的决定','有权不接受组织的监督'], a:0},
      {q:'发展党员必须把（　）放在首位。', o:['业务能力','学历层次','政治标准','社会关系'], a:2},
      {q:'发展党员工作的总要求是（　）。', o:['坚持标准、保证质量、改善结构、慎重发展','控制总量、优化结构、提高质量、发挥作用','严格程序、保证质量、突出重点、均衡发展','个别吸收、成熟一个发展一个'], a:1},

/* =====================================================================
   全局统一编号：p1 选择 → p1 填空 → p1 判断 → p2 选择 → p2 填空 → p2 判断
   ===================================================================== */
const ALL = [];
(function buildAll(){
  let no = 0;
  ['p1','p2'].forEach(bank => {
    ['choice','fill','judge'].forEach(type => {
      BANK[bank][type].forEach((item, i) => {
        no++;
        ALL.push({
          no, bank, type, i, item,
          key: bank + '-' + type + '-' + i
        });
      });
    });
  });
})();

/* ========== 状态与筛选 ========== */
const state = {};
const filter = {mode:'all', source:'all'};

function esc(s){
  return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function norm(s){
  return String(s==null?'':s)
    .replace(/\s+/g,'')
    .replace(/[，。、；：""''（）()《》〈〉\[\]【】,.;:!?！？"'_\-—–%％]/g,'')
    .toLowerCase();
}

/* ========== 单张卡片 HTML ========== */
function buildCardHTML(it, st){
  const {type, item, no, key} = it;
  const typeName = {choice:'单项选择', fill:'填空题', judge:'判断题'}[type];
  let body = '';

  if (type === 'choice'){
    body = '<div class="options">';
    item.o.forEach((o, j) => {
      let cls = 'opt';
      if (st){
        if (j === item.a) cls += ' ok';
        else if (j === st.pick) cls += ' bad';
      }
      body += `<button class="${cls}" data-j="${j}"${st?' disabled':''}><b>${'ABCD'[j]}.</b> ${esc(o)}</button>`;
    });
    body += '</div>';
  }
  else if (type === 'judge'){
    body = '<div class="options judge">';
    [true, false].forEach(v => {
      let cls = 'opt';
      if (st){
        if (v === item.a) cls += ' ok';
        else if (v === st.pick) cls += ' bad';
      }
      body += `<button class="${cls}" data-v="${v}"${st?' disabled':''}>${v?'√ 正确':'× 错误'}</button>`;
    });
    body += '</div>';
  }
  else {
    const parts = item.q.split(/(_{3,})/);
    let bi = 0;
    body = '<div class="fillq">';
    parts.forEach(p => {
      if (/^_{3,}$/.test(p)){
        let cls = 'blank';
        if (st) cls += st.oks[bi] ? ' ok' : ' bad';
        const val = st ? (st.vals[bi] || '') : '';
        body += `<input class="${cls}" data-b="${bi}" value="${esc(val)}"${st?' disabled':''} autocomplete="off">`;
        bi++;
      } else {
        body += esc(p);
      }
    });
    body += '</div>';
    if (!st) body += '<button class="submit" data-act="submit-fill">提交答案</button>';
  }

  let fb = '';
  if (st){
    if (type === 'fill'){
      if (st.ok){
        fb = '<div class="fb right">✅ 回答正确</div>';
      } else {
        const ansText = item.ans.map((a, idx) => {
          const accept = Array.isArray(a) ? a : [a];
          const label = item.ans.length > 1 ? `第${idx+1}空：` : '';
          return label + accept.join(' 或 ');
        }).join('；');
        fb = `<div class="fb wrong">❌ 回答错误，正确答案：<b>${esc(ansText)}</b></div>`;
      }
    } else if (st.ok){
      fb = '<div class="fb right">✅ 回答正确</div>';
    } else {
      const ansText = type === 'choice'
        ? 'ABCD'[item.a] + '. ' + item.o[item.a]
        : (item.a ? '正确' : '错误');
      fb = `<div class="fb wrong">❌ 回答错误，正确答案：<b>${esc(ansText)}</b></div>`;
    }
  }

  return `<div class="card" data-key="${key}" data-bank="${it.bank}" data-type="${type}" data-i="${it.i}">
    <div class="qhead">
      <span class="tag ${type}">${typeName}</span>
      <span class="num">第 ${no} 题</span>
    </div>
    ${type === 'fill' ? '' : `<div class="qtext">${esc(item.q)}</div>`}
    ${body}
    ${fb}
  </div>`;
}

/* ========== 当前筛选列表 ========== */
function currentList(){
  return ALL.filter(it =>
    (filter.source === 'all' || filter.source === it.bank) &&
    (filter.mode === 'all' || filter.mode === it.type)
  );
}

/* ========== 渲染题目 + 答题卡 ========== */
function render(){
  const list = currentList();
  const wrap = document.getElementById('quiz');
  wrap.innerHTML = list.map(it => buildCardHTML(it, state[it.key])).join('')
    || '<p class="empty">没有符合条件的题目</p>';
  renderToc(list);
  updateStats();
}

function renderToc(list){
  const grid = document.getElementById('tocGrid');
  grid.innerHTML = list.map(it => {
    const st = state[it.key];
    let cls = 'toc-btn';
    if (st) cls += st.ok ? ' right' : ' wrong';
    return `<button class="${cls}" data-key="${it.key}" title="第 ${it.no} 题">${it.no}</button>`;
  }).join('');
}

function updateTocStates(){
  document.querySelectorAll('.toc-btn').forEach(btn => {
    const st = state[btn.dataset.key];
    btn.classList.toggle('right', !!(st && st.ok));
    btn.classList.toggle('wrong', !!(st && !st.ok));
  });
}

/* ========== 替换单张卡片 ========== */
function refreshCard(card){
  const key = card.dataset.key;
  const it = ALL.find(x => x.key === key);
  if (!it) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = buildCardHTML(it, state[key]);
  card.replaceWith(tmp.firstElementChild);
  updateTocStates();
  updateStats();
}

/* ========== 统计更新 ========== */
function updateStats(){
  const cards = [...document.querySelectorAll('.card')];
  let done = 0, right = 0;
  cards.forEach(c => {
    const st = state[c.dataset.key];
    if (st){ done++; if (st.ok) right++; }
  });
  const total = cards.length;
  const wrong = done - right;
  const rate = done ? Math.round(right / done * 100) + '%' : '—';

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-done').textContent  = done;
  document.getElementById('stat-right').textContent = right;
  document.getElementById('stat-rate').textContent  = rate;

  // 更新悬浮按钮角标和弹窗统计
  document.getElementById('fabBadge').textContent = `${done}/${total}`;
  document.getElementById('tocSummary').textContent = `已做 ${done}/${total} · 正确 ${right} · 错误 ${wrong}`;
}

/* ========== 作答交互 ========== */
document.getElementById('quiz').addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const key = card.dataset.key;
  if (state[key]) return;
  const it = ALL.find(x => x.key === key);
  if (!it) return;
  const {type, item} = it;

  if (type === 'choice'){
    const btn = e.target.closest('.opt');
    if (!btn) return;
    const j = +btn.dataset.j;
    state[key] = {ok: j === item.a, pick: j};
    refreshCard(card);
  }
  else if (type === 'judge'){
    const btn = e.target.closest('.opt');
    if (!btn) return;
    const v = btn.dataset.v === 'true';
    state[key] = {ok: v === item.a, pick: v};
    refreshCard(card);
  }
  else if (type === 'fill'){
    const btn = e.target.closest('[data-act="submit-fill"]');
    if (!btn) return;
    const inputs = [...card.querySelectorAll('.blank')];
    const vals = inputs.map(x => x.value.trim());
    const oks = inputs.map((input, bi) => {
      const ans = item.ans[bi];
      if (ans === undefined) return false;
      const accept = Array.isArray(ans) ? ans : [ans];
      return accept.some(a => norm(a) === norm(vals[bi]));
    });
    state[key] = {ok: oks.every(Boolean), oks, vals};
    refreshCard(card);
  }
});

document.getElementById('quiz').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('blank')){
    const card = e.target.closest('.card');
    if (!card) return;
    const btn = card.querySelector('[data-act="submit-fill"]');
    if (btn) btn.click();
  }
});

/* ========== 答题卡弹窗逻辑 ========== */
const fabToc = document.getElementById('fabToc');
const tocModal = document.getElementById('tocModal');
const tocClose = document.getElementById('tocClose');

fabToc.addEventListener('click', () => {
  tocModal.classList.add('show');
});

function closeToc() {
  tocModal.classList.remove('show');
}

tocClose.addEventListener('click', closeToc);
tocModal.addEventListener('click', (e) => {
  if (e.target === tocModal) closeToc();
});

document.getElementById('tocGrid').addEventListener('click', e => {
  const btn = e.target.closest('.toc-btn');
  if (!btn) return;
  const key = btn.dataset.key;
  const card = document.querySelector(`.card[data-key="${key}"]`);
  if (!card) return;

  closeToc();

  // 稍作延迟等待弹窗关闭动画，再滚动页面
  setTimeout(() => {
    const cardRect = card.getBoundingClientRect();
    const targetY = Math.max(0, window.scrollY + cardRect.top - 20);
    window.scrollTo({top: targetY, behavior:'smooth'});

    card.classList.remove('flash');
    void card.offsetWidth;
    card.classList.add('flash');
    setTimeout(() => card.classList.remove('flash'), 1600);
  }, 250);
});

/* ========== 筛选切换 ========== */
document.querySelectorAll('[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filter.mode = btn.dataset.mode;
    render();
  });
});
document.querySelectorAll('[data-source]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-source]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filter.source = btn.dataset.source;
    render();
  });
});

/* ========== 重新开始 ========== */
document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('确定要清空所有作答记录，重新开始吗？')) return;
  Object.keys(state).forEach(k => delete state[k]);
  closeToc();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
});

render();
</script>
