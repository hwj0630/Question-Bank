/* 解析并追加剩余题目 */
(function appendMore(){
  const add = [];
  Object.entries(MORE).forEach(([type, txt])=>{
    txt.trim().split('\n').filter(Boolean).forEach(line=>{
      const p = line.split('~~');
      if(type === 'single'){
        add.push({t:'single', q:p[0], o:p[1].split('|'), a:p[2].trim()});
      }else if(type === 'multi'){
        add.push({t:'multi', q:p[0], o:p[1].split('|'), a:p[2].trim()});
      }
    });
  });
  QUESTIONS.push(...add);
})();

const LETTERS = 'ABCDEFGHIJ';
let currentType = 'all';
let displayedQuestions = [];

function typeName(t){return t==='single'?'单选':t==='multi'?'多选':t==='judge'?'判断':'填空';}

function getFilteredQuestions(type){
  if(type === 'all') return QUESTIONS.slice();
  return QUESTIONS.filter(q => q.t === type);
}

function setFilter(type){
  currentType = type;
  document.querySelectorAll('.filter').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.type === type);
  });
  document.getElementById('score').textContent = '';
  render();
}

function render(){
  displayedQuestions = getFilteredQuestions(currentType);
  const box = document.getElementById('quiz');
  if(displayedQuestions.length === 0){
    box.innerHTML = '<div class="q">该题型暂无题目</div>';
    return;
  }
  box.innerHTML = displayedQuestions.map((q, idx)=>{
    let inner = '';
    if(q.t==='single' || q.t==='multi'){
      inner = q.o.map((op,j)=>`<label><input type="${q.t==='single'?'radio':'checkbox'}" name="q${idx}" value="${j}"> ${LETTERS[j]}. ${op}</label>`).join('');
    }else if(q.t==='judge'){
      inner = `<label><input type="radio" name="q${idx}" value="正确"> 正确</label><label><input type="radio" name="q${idx}" value="错误"> 错误</label>`;
    }else{
      inner = `<input type="text" id="fill${idx}" placeholder="请输入答案">`;
    }
    return `<div class="q" id="q${idx}"><div class="qt"><span class="tag">${typeName(q.t)}</span>${idx+1}. ${q.q}</div>${inner}<div class="fb" id="fb${idx}"></div></div>`;
  }).join('');
}

function norm(s){
  return String(s).replace(/[\s，,。；;、"'“”‘’（）()《》<>]/g,'').toLowerCase();
}

function answerText(q){
  if(q.t==='single') return q.a + '. ' + q.o[LETTERS.indexOf(q.a)];
  if(q.t==='multi') return q.a.split('').map(l=>l+'. '+q.o[LETTERS.indexOf(l)]).join('；');
  if(q.t==='judge') return q.a;
  return q.a.join(' / ');
}

function submitQuiz(){
  let correct = 0;
  displayedQuestions.forEach((q, idx)=>{
    let ok = false, user = '';
    if(q.t==='single' || q.t==='judge'){
      const el = document.querySelector(`input[name="q${idx}"]:checked`);
      user = el ? el.value : '';
      if(q.t==='single') ok = (user !== '' && LETTERS[+user] === q.a);
      else ok = (user === q.a);
    }else if(q.t==='multi'){
      const els = [...document.querySelectorAll(`input[name="q${idx}"]:checked`)];
      user = els.map(e=>LETTERS[+e.value]).sort().join('');
      const ans = q.a.split('').sort().join('');
      ok = (user === ans);
    }else{
      const el = document.getElementById('fill'+idx);
      user = el ? el.value : '';
      ok = q.a.some(a=>norm(user) === norm(a));
    }
    if(ok) correct++;
    const fb = document.getElementById('fb'+idx);
    fb.className = 'fb ' + (ok ? 'ok' : 'bad');
    fb.textContent = ok ? '✅ 正确' : '❌ 错误，正确答案：' + answerText(q);
  });
  document.getElementById('score').textContent = `得分：${correct}/${displayedQuestions.length}`;
  window.scrollTo({top:0,behavior:'smooth'});
}

render();
</script>
